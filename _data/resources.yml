# Links on the Resources page, grouped into sections (one card each).
# Each item has a name, an optional description, and either
#   url:  a web address, or
#   file: the name of a document you've put in assets/resources/
#         (e.g. file: "ECR_Career_Slides.pdf"). It gets a PDF/DOCX label.
# Leave url empty ("") and the page shows "link to be added". A file that
# isn't in assets/resources/ yet shows "file to be added".

