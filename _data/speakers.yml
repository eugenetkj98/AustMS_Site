  institution: University of Western Australia (UWA)
  photo: "/assets/speakers/Cheryl_Praeger.png"
  bio: >-
    Cheryl Praeger is Emeritus Professor of Mathematics at UWA and former AustMS President. In 2012 she received a national AOLT Citation for “developing the gold standard in mathematics research supervision and over thirty years of nurturing a research community where undergraduate and postgraduate mathematics research flourishes”.

