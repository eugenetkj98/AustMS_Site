- name: Emer. Prof. Robyn Owens
  institution: "University of Western Australia (UWA)"
  photo: "/assets/speakers/Robyn_Owens.png"
  bio: >-
    Robyn Owens (AM, FAA, FTSE) is the former Deputy Vice-Chancellor (Research) of the University of Western Australia. Robyn was trained in mathematics at UWA, Oxford and the University of Paris. Her research was primarily in computer vision, on both theoretical and applied aspects of feature recognition in images.
  
