# Speakers on the Speakers page, shown in this order.
#
# Each speaker has:
#   name:        Full name, as it should appear on the site.
#   institution: University or organisation.
#   bio:         A short paragraph. Markdown works (*italics*, **bold**, [links](https://...)).
#                Start it with ">-" on its own line, then indent the text underneath,
#                so commas, colons and quotes don't upset YAML.
#   photo:       Path to a picture in assets/speakers/, for example
#                "/assets/speakers/jane-citizen.jpg". A square image about 400 x 400
#                pixels works best. Leave it empty ("") and the page shows the
#                speaker's initials in a circle instead.
#
# Leave institution or bio empty ("") and the page shows a "to be added" placeholder.
# The two entries below are SAMPLES: replace them with real speakers.

- name: Dr Luciana Basualdo Bonatto
  institution: University of Oxford
  photo: "/assets/speakers/Luciana_Bonatto.png"
  bio: >-
    Luciana Basualdo Bonatto is a lecturer at the Mathematical Institute and Balliol College at the University of Oxford. She has held postdoctoral positions at the Max Planck Institute for Mathematics in Bonn and an EPSRC Postdoctoral Research Associate in Algebraic Topology at the University of Oxford. She is the 2026 AustMS ECR Lecturer.

- name: Dr Brendan Florio
  institution: "University of Western Australia (UWA)"
  photo: "/assets/speakers/Brendan_Florio.png"
  bio: >-
    Brendan Florio is a Senior Lecturer at the University of Western Australia. He has been in and out of academia, with roles at CSIRO and as a high school teacher. Brendan is an applied mathematician with an interest in industrial modelling. 

- name: Emer. Prof. Robyn Owens
  institution: "University of Western Australia (UWA)"
  photo: "/assets/speakers/Robyn_Owens.png"
  bio: >-
    Robyn Owens (AM, FAA, FTSE) is the former Deputy Vice-Chancellor (Research) of the University of Western Australia. Robyn was trained in mathematics at UWA, Oxford and the University of Paris. Her research was primarily in computer vision, on both theoretical and applied aspects of feature recognition in images.
  
- name: Dr Shannon Algar
  institution: University of Western Australia (UWA)
  photo: "/assets/speakers/Shannon_Algar.png"
  bio: >-
    Shannon Algar is a Senior Lecturer in the Complex Systems Group at the University of Western Australia, focusing on the application of topological data analysis to study how structure and computation emerge in complex systems, especially swarms and reservoir computing, building interpretable models of collective behaviour. She is passionate about using mathematical tools to tackle real-world problems, particularly in interdisciplinary settings, and advocates for the role of mathematics in uncovering structure in complex systems.

- name: Dr Hayden Tronnolone
  institution: Flinders University
  photo: "/assets/speakers/Hayden_Tronnolone.png"
  bio: >-
    Hayden Tronnolone is a Senior Lecturer at Flinders University. He holds a PhD in fluid mechanics and completed postdoctoral work in mathematical biology studying the growth of yeast using both on- and off-lattice discrete models and image processing. Hayden is interested in mathematics education. This includes ways to support people to overcome anxiety towards mathematics and form a positive relationship with the discipline, and assessment approaches in mathematics. He was awarded the 2025 STEMM Educator of the Year for South Australia.

- name: Dr Hoa Bui
  institution: Curtin University
  photo: "/assets/speakers/Hoa_Bui.png"
  bio: >-
    Hoa Bui is a Senior Lecturer and DECRA Fellow in the Centre for Optimisation and Decision Science, Curtin University. Her research focuses on high-performance optimisation algorithms for large scale integer nonlinear optimisation problems. She translates advanced mathematical theory into practical computational methods, making challenging problems more tractable and enabling better real world decision making.

- name: Dr Alex Tam
  organiser: true
  institution: Adelaide University
  photo: "/assets/speakers/Alex_Tam.jpg"
  bio: >-
    Alex Tam is an applied mathematician and mathematical biologist, working as a Senior Lecturer at Adelaide University. He is an AustMS Early Career Representative and current ARC DECRA Fellow.

- name: Emer. Prof. Cheryl Praeger
  institution: University of Western Australia (UWA)
  photo: "/assets/speakers/Cheryl_Praeger.png"
  bio: >-
    Cheryl Praeger is Emeritus Professor of Mathematics at UWA and former AustMS President. In 2012 she received a national AOLT Citation for “developing the gold standard in mathematics research supervision and over thirty years of nurturing a research community where undergraduate and postgraduate mathematics research flourishes”.

- name: Dr Michael Hartley
  institution: DUG Technology
  photo: "/assets/speakers/Michael_Hartley.jpg"
  bio: >-
    Michael Hartley completed his PhD under Cheryl Praeger in 1996, and spent his early career in academia in Malaysia. He now works as a mathematician in the energy industry in Perth, as well as maintaining a website of maths games for parents and educators of primary-aged kids.

- name: Assoc. Prof. John Bamberg
  institution: University of Western Australia (UWA)
  photo: "/assets/speakers/John_Bamberg.png"
  bio: >-
    John Bamberg is an Associate Professor in the Centre for the Mathematics of Symmetry and Computation within the Department of Mathematics and Statistics at the University of Western Australia. His main research areas are group theory and combinatorics, and he was a 2012 ARC Future Fellow.

- name: Dr Geoffrey Pearce
  institution: Perth Modern School
  photo: ""
  bio: >-
    Geoffrey Pearce completed a PhD under Cheryl Praeger, and is currently a mathematics teacher at Perth Modern School. He contributes to the public discussion of mathematics, most recently through a colloquium talk about modular origami.

- name: Dr Julia Collins
  institution: Edith Cowan University (ECU)
  photo: "/assets/speakers/Julia_Collins.png"
  bio: >-
    Julia Collins is a Senior Lecturer at Edith Cowan University and was previously a lecturer and public engagement officer at the University of Edinburgh. She has worked together with the Australian Mathematical Sciences Institute (AMSI) on the CHOOSEMATHS project. Julia is also the author of two general-interest books on mathematics: Get Smart: Maths (2018) and Numbers in Minutes (2019) and is the founder of Maths Craft Australia.

- name: Dr Scott Lindstrom
  institution: Curtin University
  photo: "/assets/speakers/Scott_Lindstrom.png"
  bio: >-
    Scott Lindstrom is a Senior Lecturer at Curtin University focusing on applying variational analysis and computational tools to study nonlinear optimisation problems. He holds a PhD from the University of Newcastle, and subsequently held a postdoctoral position at Hong Kong Polytechnic University.

- name: Dr Rhuaidi Burke
  institution: The University of Oxford
  photo: "/assets/speakers/Rhuaidi_Burke.jpg"
  bio: >-
    Rhuaidi Burke is a Postdoctoral Research Associate at the Mathematical Institute, University of Oxford. He completed his PhD at the University of Queensland. His research is in computational topology, using computational techniques to study standard and exotic 4-manifolds.

- name: Dr Madeline Nurcombe
  institution: The University of Melbourne
  photo: ""
  bio: >-
    Madeline Nurcombe is a postdoctoral researcher studying mathematical physics and representation theory. She completed her PhD in mathematics at the University of Queensland in 2024, where her thesis introduced the ghost algebra, dilute ghost algebra, and label algebra as novel two-boundary generalisations of the Temperley–Lieb algebra.

- name: Max Orchard
  institution: The University of Queensland
  photo: ""
  bio: >-
    Max Orchard is a PhD student interested in Riemannian geometry and symmetries, under the supervision of Prof Artem Pulemotov, Dr Timothy Buttsworth, and A/Prof Ramiro Lafuente at The University of Queensland.

- name: Dominic Matan
  institution: University of New South Wales (UNSW)
  photo: ""
  bio: >-
    Dominic Matan is a PhD student in pure mathematics and a tutor at the School of Mathematics and Statistics, UNSW Sydney. His PhD project is under the primary supervision of Professor Daniel Chan and secondary supervision of Dr. Behrouz Taji. 

- name: Dr Yudhi Bunjamin
  organiser: true
  institution: University of New South Wales (UNSW)
  photo: "/assets/speakers/Yudhi_Bunjamin.jpg"
  bio: >-
    Yudhi Bunjamin is an Associate Lecturer at The University of New South Wales. His research interests are in combinatorial design theory, and he completed a PhD under Professor Catherine Greenhill, Dr. Diana Combe, and Dr. Julian Abel. As a current AustMS Early Career Representative, he is interested in mathematical communication, and hosts the Neumann Talk podcast.

- name: Dr Eugene Tan
  organiser: true
  institution: The Kids Research Institute Australia
  photo: "/assets/speakers/Eugene_Tan.jpg"
  bio: >-
    Eugene Tan is a Research Officer at The Kids Research Institute Australia. He is an applied mathematician with a background in agent-based models, time series analysis and embedding theory. Eugene is interested the study of emergent dynamics in complex systems, with a particular focus on disease spread on social networks. He is the Local Organiser of the 2026 ECW.