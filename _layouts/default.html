<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip }}">
<meta name="theme-color" content="{{ site.accent_color }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='{{ site.accent_color | replace: '#', '%23' }}'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3E{{ site.logo_text }}%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<style>:root { --brand: {{ site.accent_color }}; }</style>
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">
    <span class="logo" aria-hidden="true">{{ site.logo_text }}</span>
    <span class="site-name">{{ site.title }}<small>{{ site.tagline }}</small></span>
  </a>
  <nav class="tabs" aria-label="Main">
    {%- for item in site.data.navigation %}
    {%- assign item_url = item.url | relative_url %}
    {%- assign page_url = page.url | replace: 'index.html', '' | relative_url %}
    <a href="{{ item_url }}"{% if item_url == page_url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
  </nav>
</header>
{{ content }}
</body>
</html>
